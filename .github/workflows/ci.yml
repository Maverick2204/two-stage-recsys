name: ci
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements-train.txt
      - run: pytest -q
      # Real H&M data needs Kaggle credentials, so the image smoke test uses synthetic data with the same schema.
      - run: python -m tests.fake_hm data/fake && DATA=data/fake WEEKS=16 EPOCHS=1 python -m recsys.train
      - run: docker build -t recsys .
      - run: |
          docker run -d -p 8000:8000 recsys
          timeout 60 sh -c 'until curl -sf localhost:8000/health; do sleep 1; done'
          curl -sf "localhost:8000/recommend/$(curl -s 'localhost:8000/users/sample?n=1' | tr -d '[]\"')" | grep two_stage
